<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>Xion-Manager - Control Operativo y Financiero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('xion_manager_preferences');
          var prefs = raw ? JSON.parse(raw) : null;
          var theme = prefs && prefs.theme_mode ? prefs.theme_mode : 'dark';
          var isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (prefs && prefs.primary_color) {
            var hex = prefs.primary_color.replace('#', '');
            var r = parseInt(hex.substring(0, 2), 16) || 0;
            var g = parseInt(hex.substring(2, 4), 16) || 0;
            var b = parseInt(hex.substring(4, 6), 16) || 0;
            document.documentElement.style.setProperty('--brand-primary', prefs.primary_color);
            document.documentElement.style.setProperty('--brand-primary-rgb', r + ', ' + g + ', ' + b);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
